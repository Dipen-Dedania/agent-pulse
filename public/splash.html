<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;" />
    <title>Agent Pulse</title>
    <!--
      Launch splash. Loaded by its own frameless, transparent, always-on-top
      window (src/main/windows/splash-window.ts) while the settings window
      loads hidden, so the animated logo floats over the desktop with no box
      behind it. Static on purpose: no bundle, no script — it paints the moment
      the window exists. Geometry mirrors src/common/logo-geometry.ts and
      public/assets/logo.svg (a test keeps them in sync).
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: no-drag;
      }
      body { display: grid; place-items: center; }
      .sp-logo {
        width: 128px;
        height: 128px;
        overflow: visible;
        filter: drop-shadow(0 8px 32px rgba(59, 130, 246, 0.35));
        animation: sp-in 0.28s ease-out both;
      }
      /* Heartbeat: a comet with a bright lead dot runs the whole capsule-and-
         spike loop; the halo flashes as the dot passes the spike. */
      .sp-outline, .sp-spike { opacity: 0.55; }
      .sp-trace { stroke-dasharray: 26 102; animation: sp-trace 2.6s linear infinite; }
      .sp-dot { stroke-dasharray: 0.6 127.4; animation: sp-dot 2.6s linear infinite; }
      .sp-glow { opacity: 0.75; animation: sp-beat 2.6s linear infinite; }
      /* Blink: CSS-only — one blink, then a double. */
      .sp-eye { animation: sp-blink 5.2s ease-in-out infinite; }
      @keyframes sp-in { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes sp-trace { from { stroke-dashoffset: 128; } to { stroke-dashoffset: 0; } }
      @keyframes sp-dot { from { stroke-dashoffset: 102; } to { stroke-dashoffset: -26; } }
      @keyframes sp-beat { 0%, 8% { opacity: 0.45; } 20% { opacity: 1; } 48%, 100% { opacity: 0.45; } }
      @keyframes sp-blink {
        0%, 38%, 42%, 88%, 92%, 96%, 100% { transform: scaleY(1); }
        40%, 90%, 94% { transform: scaleY(0.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .sp-trace, .sp-dot { opacity: 0; }
        .sp-outline, .sp-spike { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <svg class="sp-logo" viewBox="0 0 940 940" role="img" aria-label="Agent Pulse is starting" focusable="false">
      <defs>
        <linearGradient id="sp-body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2b58d8"/><stop offset="1" stop-color="#0f2777"/>
        </linearGradient>
        <linearGradient id="sp-visor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0c1b52"/><stop offset="1" stop-color="#0a1744"/>
        </linearGradient>
        <linearGradient id="sp-bar" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="835" y2="0">
          <stop offset="0" stop-color="#7cfd2f"/><stop offset=".40" stop-color="#83f838"/>
          <stop offset=".60" stop-color="#53dc6e"/><stop offset="1" stop-color="#48d082"/>
        </linearGradient>
        <linearGradient id="sp-fill" gradientUnits="userSpaceOnUse" x1="125" y1="0" x2="400" y2="0">
          <stop offset="0" stop-color="#1cc158"/><stop offset="1" stop-color="#1c9c6a"/>
        </linearGradient>
        <filter id="sp-glow-s" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="sp-glow-m" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
        <filter id="sp-glow-trace" x="-10%" y="-60%" width="120%" height="220%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <clipPath id="sp-visor-clip"><rect x="245" y="300" width="450" height="260" rx="105"/></clipPath>
        <clipPath id="sp-house-clip">
          <rect x="70" y="612" width="800" height="190" rx="95"/>
          <path d="M330 780 A180 180 0 0 0 610 780 Z"/>
        </clipPath>
      </defs>
      <g>
        <rect x="455" y="100" width="30" height="85" rx="8" fill="#1c3f9c" stroke="#0b163f" stroke-width="10"/>
        <circle cx="470" cy="85" r="46" fill="#1c3f9c" stroke="#0b163f" stroke-width="10"/>
        <circle cx="470" cy="85" r="24" fill="#2ee6f0" opacity=".7" filter="url(#sp-glow-s)"/>
        <circle cx="470" cy="85" r="20" fill="#2ee6f0"/>
        <rect x="98" y="388" width="80" height="154" rx="34" fill="#1c3f9c" stroke="#0b163f" stroke-width="10"/>
        <rect x="118" y="414" width="40" height="102" rx="18" fill="#1fb6d8" opacity=".9"/>
        <rect x="762" y="388" width="80" height="154" rx="34" fill="#1c3f9c" stroke="#0b163f" stroke-width="10"/>
        <rect x="782" y="414" width="40" height="102" rx="18" fill="#1fb6d8" opacity=".9"/>
        <path d="M180 614 V460 A290 290 0 0 1 760 460 V614 Z" fill="url(#sp-body)" stroke="#0b163f" stroke-width="12" stroke-linejoin="round"/>
        <path d="M210 614 V465 A260 260 0 0 1 730 465 V614" fill="none" stroke="#22c5e8" stroke-width="9" opacity=".75"/>
        <path d="M565 214 V300" fill="none" stroke="#22c5e8" stroke-width="9" opacity=".75"/>
        <rect x="245" y="300" width="450" height="260" rx="105" fill="url(#sp-visor)" stroke="#22c5e8" stroke-width="12"/>
        <g clip-path="url(#sp-visor-clip)">
          <g class="sp-eye" style="transform-origin: 365px 440px">
            <circle cx="365" cy="440" r="36" fill="#2ee6f0" opacity=".75" filter="url(#sp-glow-s)"/>
            <circle cx="365" cy="440" r="30" fill="#2ee6f0"/>
          </g>
          <g class="sp-eye" style="transform-origin: 575px 440px">
            <circle cx="575" cy="440" r="36" fill="#2ee6f0" opacity=".75" filter="url(#sp-glow-s)"/>
            <circle cx="575" cy="440" r="30" fill="#2ee6f0"/>
          </g>
        </g>
      </g>
      <path d="M330 780 A180 180 0 0 0 610 780 Z" fill="#0a2a55" stroke="#07183d" stroke-width="10"/>
      <rect x="70" y="612" width="800" height="190" rx="95" fill="#06224a" stroke="#07183d" stroke-width="10"/>
      <g class="sp-glow" clip-path="url(#sp-house-clip)">
        <path d="M360 662 H165 A43 43 0 0 0 165 748 H400 L442 642 L485 812 L530 692 L548 748 H790 A43 43 0 0 0 790 662 H572"
              fill="none" stroke="#22c55e" stroke-width="90" stroke-linecap="round" stroke-linejoin="round" opacity=".45" filter="url(#sp-glow-m)"/>
        <path d="M360 662 H165 A43 43 0 0 0 165 748 H400 L442 642 L485 812 L530 692 L548 748 H790 A43 43 0 0 0 790 662 H572"
              fill="none" stroke="#22c55e" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity=".55" filter="url(#sp-glow-s)"/>
      </g>
      <path d="M372 662 H165 A43 43 0 0 0 165 748 H396 Z" fill="url(#sp-fill)"/>
      <path d="M572 662 H790 A43 43 0 0 1 790 748 H556 Z" fill="#1c9c6a"/>
      <path class="sp-outline" pathLength="1000" stroke-dasharray="432 113 455"
            d="M360 662 H165 A43 43 0 0 0 165 748 H400 H548 H790 A43 43 0 0 0 790 662 H572"
            fill="none" stroke="url(#sp-bar)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="sp-spike" d="M400 748 L442 642 L485 812 L530 692 L548 748"
            fill="none" stroke="url(#sp-bar)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="sp-trace" pathLength="100"
            d="M360 662 H165 A43 43 0 0 0 165 748 H400 L442 642 L485 812 L530 692 L548 748 H790 A43 43 0 0 0 790 662 H572"
            fill="none" stroke="#f4fff6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#sp-glow-trace)"/>
      <path class="sp-dot" pathLength="100"
            d="M360 662 H165 A43 43 0 0 0 165 748 H400 L442 642 L485 812 L530 692 L548 748 H790 A43 43 0 0 0 790 662 H572"
            fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </body>
</html>
